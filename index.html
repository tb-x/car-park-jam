<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Car Park Jam</title>
<meta name="theme-color" content="#2f6fde">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Park">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<style>
  /* Layout: the 3D car park fills the screen; the level badge sits top-centre between the home and sound buttons, and the title and win cards float over the middle. */
  :root{
    --ink:#23324a; --cream:#fff8e7; --blue:#2f6fde; --blue-d:#1f4fa8; --green:#3fb950; --green-d:#2a7d38; --yellow:#ffd23f; --red:#e5484d;
    --title:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    --read:Verdana,Tahoma,sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:#8fd16a;color:var(--ink);font-family:var(--read);
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

  #stage{position:fixed;inset:0;overflow:hidden;background:#8fd16a}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---------- badge: level number and the cars still in the car park ---------- */
  #badge{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:5;
    display:flex;align-items:center;gap:12px;padding:4px 14px 4px 6px;border-radius:24px;background:rgba(255,255,255,.88);
    box-shadow:0 3px 0 rgba(0,0,0,.15);pointer-events:none;white-space:nowrap;font-weight:bold;font-size:20px}
  #badge span{display:flex;align-items:center;gap:5px}
  #badge svg{width:32px;height:32px;display:block}
  #left.pop{animation:pop .35s}
  @keyframes pop{40%{transform:scale(1.35)}}

  #mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.88);font-size:22px;line-height:44px;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.15)}

  /* ---------- home: back to the list of all games ---------- */
  #home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#23324a;background:rgba(255,255,255,.88);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* ---------- hint hand and the cross "beep!" bubbles, placed over the 3D cars ---------- */
  #hand{position:absolute;left:0;top:0;width:58px;height:58px;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
  #hand.on{opacity:1}
  #hand svg{width:100%;height:100%;animation:tap 1s ease-in-out infinite}
  @keyframes tap{0%,100%{transform:translate(0,0)}45%{transform:translate(0,10px) scale(.92)}}
  .bubble{position:absolute;left:0;top:0;z-index:4;pointer-events:none;font-size:30px;line-height:1;
    padding:4px 7px 6px;border-radius:16px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);transform:translate(-50%,-100%);
    animation:bub .9s ease-out forwards}
  .bubble::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
  @keyframes bub{0%{opacity:0;scale:.3}15%{opacity:1;scale:1.15}25%{scale:1}80%{opacity:1}100%{opacity:0;scale:1}}

  /* ---------- cards: title and level done ---------- */
  .veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(20,40,70,.25)}
  .card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 28px 24px;border-radius:30px;background:var(--cream);
    box-shadow:0 8px 0 rgba(0,0,0,.18);text-align:center;max-width:min(420px, 92vw);animation:rise .45s cubic-bezier(.3,1.5,.6,1)}
  @keyframes rise{from{transform:translateY(40px) scale(.8);opacity:0}}
  .card h1{margin:0;font-family:var(--title);font-weight:normal;font-size:clamp(38px, 10vmin, 58px);line-height:1;color:var(--blue);
    letter-spacing:1px;text-shadow:0 3px 0 #fff, 0 5px 0 rgba(0,0,0,.12)}
  .card .lvl{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:22px}
  .card .lvl svg{width:36px;height:36px}
  .big{width:clamp(84px, 22vmin, 112px);height:clamp(84px, 22vmin, 112px);border-radius:50%;background:var(--green);color:#fff;
    display:grid;place-items:center;box-shadow:0 6px 0 var(--green-d);padding:0}
  .big svg{width:52%;height:52%;margin-left:8%}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-d)}
  #again{position:absolute;right:12px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.06);font-size:18px;padding:0;color:#556}
  #title .card{position:relative}
  .cheer{font-size:clamp(50px, 14vmin, 72px);line-height:1}
  .cheer i{display:inline-block;font-style:normal;animation:hop .6s ease-in-out infinite alternate}
  .cheer i:nth-child(2){animation-delay:.15s}
  .cheer i:nth-child(3){animation-delay:.3s}
  @keyframes hop{to{transform:translateY(-10px)}}

  .confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:19;pointer-events:none;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (prefers-reduced-motion: reduce){ .card,.cheer i,#hand svg{animation:none} }
</style>
</head>
<body>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<button id="mute" aria-label="Sound on or off">🔈</button>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="badge" aria-hidden="true">
    <span><svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="6" fill="#2f6fde" stroke="#fff" stroke-width="2"/><path d="M11 25V8h6.5a5 5 0 0 1 0 10H11" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round"/></svg><b id="lvl"></b></span>
    <span id="left"><svg viewBox="0 0 32 32"><path d="M4 21v-4.5l3.5-6.5h14l5 6.5h1.5v4.5z" fill="#e5484d" stroke="#23324a" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12h5v4.5H7.3zM17 12h4l3.4 4.5H17z" fill="#bfe6ff"/><circle cx="10" cy="22" r="3.2" fill="#2b2b33"/><circle cx="23" cy="22" r="3.2" fill="#2b2b33"/></svg><b id="count"></b></span>
  </div>
  <div id="hand"><svg viewBox="0 0 64 64"><path d="M25 7a5 5 0 0 1 10 0v21l3-.6a5 5 0 0 1 5.6 3.2l.4.9a5 5 0 0 1 6.6 3.4l.3.9a5 5 0 0 1 6.1 4.9V48c0 8.8-7.2 14-16 14h-5c-6.2 0-10.6-2.8-14-8L11 43.5a5 5 0 0 1 7.6-6.4L25 43z" fill="#fff" stroke="#23324a" stroke-width="3" stroke-linejoin="round"/></svg></div>
</div>

<div id="title" class="veil">
  <div class="card">
    <h1>Car Park<br>Jam</h1>
    <div class="lvl"><svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="6" fill="#2f6fde" stroke="#fff" stroke-width="2"/><path d="M11 25V8h6.5a5 5 0 0 1 0 10H11" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round"/></svg><span id="tlvl"></span></div>
    <button id="play" class="big" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg></button>
    <button id="again" aria-label="Start again from level 1" title="Start again from level 1" hidden>↺</button>
  </div>
</div>

<div id="done" class="veil" hidden>
  <div class="card">
    <div class="cheer" aria-hidden="true"><i>🚗</i><i>🚌</i><i>🚕</i></div>
    <div class="lvl"><svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="6" fill="#2f6fde" stroke="#fff" stroke-width="2"/><path d="M11 25V8h6.5a5 5 0 0 1 0 10H11" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round"/></svg><span id="dlvl"></span> <span aria-hidden="true">✅</span></div>
    <button id="next" class="big" aria-label="Next car park"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg></button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ======== tuning knobs ======== */
const DRIVE_SPEED = 5;      // top speed in the car park, squares per second
const ROAD_SPEED = 7;       // top speed on the road round the car park
const ACCEL = 9;            // how fast cars pick up speed
const BRAKE = 30;           // how hard they stop for a car in front
const BUMP_SPEED = 4.5;     // how fast a blocked car rolls up to whatever is in its way
const HINT_DELAY = 9;       // seconds without a car leaving before a hand shows one that can go
const FIRST_HINT = 1.2;     // the same on level 1, where the hand teaches the tap
const PIVOT_RATE = 6;       // how fast a car turns on the spot when it pulls out onto the road (radians a second)
const STUCK_POOF = 6;       // a last resort: when no car at all has moved for this long, the one waiting longest vanishes in a puff
const POP_DOWN = 4;         // pop-up bollards: seconds down (cars can pass),
const POP_WARN = 1;         // seconds blinking before they rise,
const POP_UP = 3;           // and seconds up (in the way)
const DUCK_EVERY = [14, 24];   // seconds between duck families crossing the exit road (shortest, longest)
const DUCK_SPEED = 0.9;     // how fast the ducks waddle, squares per second
const ASSET_V = 1;          // bump after replacing any file in assets/, so phones don't keep the old one
const CLIP_VOL = 0.9;       // sound effects and the voice
const MUSIC_VOL = 0.22;     // background music (it dips while the voice speaks)
const HELP_TIMES = 2;       // how many times each helper line is said, ever (they're remembered on the device)
// each clip's loudness, evened out from measuring them: frequent sounds (bollards, the barrier, stars) kept low
const CLIP_TRIM = { 'sfx-start': 1.1, 'sfx-start-big': 0.8, 'sfx-honk': 1, 'sfx-horn-big': 0.7, 'sfx-bump': 1.2, 'sfx-bollard': 0.45,
  'sfx-clang': 1.1, 'sfx-gate': 0.5, 'sfx-siren-police': 0.5, 'sfx-siren-fire': 0.5, 'sfx-siren-ambulance': 0.35, 'sfx-jingle': 0.6,
  'sfx-yawn': 0.9, 'sfx-quack': 0.75, 'sfx-peep': 0.7, 'sfx-sparkle': 0.55, 'sfx-fanfare': 0.9 };
const MUSIC_XFADE = 2;      // seconds of each music track's end blended into its start, so it loops without a seam
// Each car park: w×h squares, cars, the share of long ones (buses, fire engines, lorries, mixers), obstacles (cones,
// trees, bollards), the share of edges with a hedge (no way out there), and depth: how many rounds it should take if
// every car that can go leaves at once. Then the extras: sleepy cars (tap once to wake them), pop-up bollards that
// rise and sink, and ducks that cross the exit road. Level 1 is drawn by hand. After the list, levels repeat the last
// ones with new layouts.
const LEVELS = [
  null,
  { w: 3, h: 4, cars: 4, depth: 2 },
  { w: 4, h: 4, cars: 5, depth: 2, ducks: true },
  { w: 4, h: 5, cars: 7, depth: 3, sleepy: 1 },
  { w: 4, h: 5, cars: 6, long: 0.35, depth: 3, sleepy: 1, ducks: true },
  { w: 5, h: 5, cars: 8, long: 0.2, depth: 3 },
  { w: 5, h: 6, cars: 9, obst: 2, depth: 3, sleepy: 1 },
  { w: 5, h: 6, cars: 11, long: 0.2, obst: 2, depth: 4, ducks: true },
  { w: 5, h: 6, cars: 10, fence: 0.3, depth: 4, pops: 1 },
  { w: 5, h: 7, cars: 13, long: 0.2, depth: 4, sleepy: 2, ducks: true },
  { w: 6, h: 7, cars: 15, long: 0.2, obst: 2, depth: 4, pops: 2 },
  { w: 6, h: 7, cars: 15, long: 0.25, fence: 0.3, depth: 5, sleepy: 2, ducks: true },
  { w: 6, h: 8, cars: 17, long: 0.25, obst: 3, fence: 0.25, depth: 5, pops: 2 },
  { w: 7, h: 8, cars: 20, long: 0.25, obst: 3, fence: 0.25, depth: 5, sleepy: 2, ducks: true },
  { w: 7, h: 9, cars: 22, long: 0.3, obst: 4, fence: 0.3, depth: 6, pops: 3, sleepy: 2, ducks: true },
];
const REPEAT_FROM = 10;     // past the list, levels pick from LEVELS[REPEAT_FROM..]
const COLORS = ['#e5484d', '#2f6fde', '#3fb950', '#ff8a1f', '#8b5cf6', '#ff6fa8', '#14b8a6', '#ffd23f', '#6fc3ff'];
// The look of each car park: sky, light and plants. Car parks 1-2 are sunny, then the themes take turns.
const THEMES = {
  day: { sky: '#8fcbff', horizon: '#e4f4ff', fog: '#cfe8f7', grass: ['#79c257', '#8fd067', '#6bb54c'], hemi: ['#ffffff', '#7c8f5c', 0.4],
    sun: ['#fff1d8', 2.8], sunDir: [-0.5, 1, -0.35], exposure: 0.8, leaves: ['#3f9c45', '#52b04c', '#2f8a3c'], flowers: true },
  evening: { sky: '#f59a62', horizon: '#ffd9a3', fog: '#f0c49a', grass: ['#86b552', '#98c35e', '#77a748'], hemi: ['#ffd8b5', '#5b4d6b', 0.55],
    sun: ['#ffb066', 3.0], sunDir: [-1, 0.75, -0.25], exposure: 0.9, leaves: ['#4b8d3a', '#62a03e', '#3d7a34'], flowers: true, lamps: 0.7 },
  autumn: { sky: '#a7cbe8', horizon: '#eef1e4', fog: '#e2dccb', grass: ['#9db35a', '#adbf63', '#8ea64f'], hemi: ['#fff5e6', '#7a6a4a', 0.4],
    sun: ['#ffe2b8', 2.7], sunDir: [-0.4, 1, -0.5], exposure: 0.8, leaves: ['#ea8a2b', '#d9542b', '#f2c03a', '#c4662a'], fallen: true, fall: 'leaves' },
  snow: { sky: '#bcd6ea', horizon: '#eef4f9', fog: '#e3edf5', grass: ['#f3f7fb', '#ffffff', '#e4ecf3'], hemi: ['#ffffff', '#b9c6d3', 0.45],
    sun: ['#fff8f0', 2.3], sunDir: [-0.5, 1, -0.2], exposure: 0.75, leaves: ['#2f7a4a', '#3b8a52', '#2a6a42'], snow: true, fall: 'snow' },
  night: { sky: '#1a2848', horizon: '#33507c', fog: '#1f3254', grass: ['#5f9a49', '#6aa653', '#558f42'], hemi: ['#a9c0ff', '#24322a', 0.85],
    sun: ['#c4d4ff', 1.6], sunDir: [0.45, 1, -0.5], exposure: 1.1, leaves: ['#3f8f45', '#4b9c4c', '#357d3c'], lamps: 1, night: true },
};
const THEME_ORDER = ['day', 'evening', 'autumn', 'snow', 'night'];
const themeFor = (n) => THEMES[params.get('theme')] || THEMES[n <= 2 ? 'day' : THEME_ORDER[(n - 3) % THEME_ORDER.length]];

/* ======== little helpers ======== */
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('carpark.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('carpark.' + k, JSON.stringify(v)); } catch {} },
};
const params = new URLSearchParams(location.search);
const FORCE_MUTE = params.has('mute') || params.has('tbxtest');   // test runs stay silent
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (t) => t * t * (3 - 2 * t);
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ======== sound: recorded clips, each with a synthesized stand-in ======== */
// The clips in assets/ (ElevenLabs, see the README) load while the title shows and decode on the first tap. Every
// sound falls back to a synthesized version when its clip can't load (from disk, say), and the voice to the device's
// own voice.
const CLIPS = ['sfx-start', 'sfx-start-big', 'sfx-honk', 'sfx-horn-big', 'sfx-bump', 'sfx-bollard', 'sfx-clang', 'sfx-gate',
  'sfx-siren-police', 'sfx-siren-fire', 'sfx-siren-ambulance', 'sfx-jingle', 'sfx-yawn', 'sfx-quack', 'sfx-peep', 'sfx-sparkle',
  'sfx-fanfare', 'say-out-1', 'say-out-2', 'say-out-3', 'say-tap', 'say-sleepy', 'say-bollard', 'say-ducks', 'music-day', 'music-night'];
const SAID = { 'say-out-1': 'All the cars are out!', 'say-out-2': 'Hooray! Everyone is out!', 'say-out-3': 'Great job! The car park is empty!',
  'say-tap': 'Tap a car that can drive out!', 'say-sleepy': "Shh, it's asleep. Tap to wake it up!",
  'say-bollard': 'Wait for the bollard to go down!', 'say-ducks': 'Wait for the ducks!' };
const sfx = (() => {
  let ac = null, out = null, musicBus = null, noise = null, muted = FORCE_MUTE || store.get('muted', false), track = null, wantMusic = null, voiceUntil = 0;
  const raw = {}, clips = {};
  for (const n of CLIPS) raw[n] = fetch(`assets/${n}.mp3?v=${ASSET_V}`).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
  function init() {
    if (ac) { if (ac.state !== 'running') ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); out = ac.createGain(); out.gain.value = muted ? 0 : 0.8; out.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = 1; musicBus.connect(out);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    for (const n of CLIPS) raw[n].then((b) => b && new Promise((res, rej) => ac.decodeAudioData(b, res, rej)))
      .then((buf) => { if (!buf) return; clips[n] = n.startsWith('music') ? loopable(buf) : buf; if (wantMusic === n) music(n); }).catch(() => {});
  }
  const ok = () => ac && ac.state === 'running';   // muted sounds still play, into a silent output
  // the end of a music track blended into its start, so it loops without a seam
  function loopable(buf) {
    const X = Math.floor(MUSIC_XFADE * buf.sampleRate), L = buf.length - X;
    const b = ac.createBuffer(buf.numberOfChannels, L, buf.sampleRate);
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const d = buf.getChannelData(c), o = b.getChannelData(c);
      o.set(d.subarray(0, L));
      for (let i = 0; i < X; i++) { const u = i / X; o[i] = d[i] * Math.sin(u * Math.PI / 2) + d[L + i] * Math.cos(u * Math.PI / 2); }
    }
    return b;
  }
  // plays a loaded clip; false if it isn't loaded, so the caller can synthesize instead
  function clip(name, at = 0) {
    const buf = clips[name]; if (!ok() || !buf) return false;
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf;
    g.gain.value = CLIP_VOL * (CLIP_TRIM[name] ?? 1); s.connect(g).connect(out); s.start(ac.currentTime + at);
    return buf.duration;
  }
  // one looping track at a time, crossfading when it changes
  function music(name) {
    wantMusic = name;
    if (!ac) return;
    const t = ac.currentTime;
    if (track && track.name === name) return;
    if (track) { const old = track; old.g.gain.setTargetAtTime(0.0001, t, 0.4); setTimeout(() => { try { old.s.stop(); } catch {} }, 2500); track = null; }
    const buf = name && clips[name]; if (!buf) return;
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; s.loop = true;
    g.gain.setValueAtTime(0.0001, t); g.gain.setTargetAtTime(MUSIC_VOL, t, 0.6);
    s.connect(g).connect(musicBus); s.start(); track = { name, s, g };
  }
  function tone(type, f0, f1, at, dur, vol, cut) {
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.setValueAtTime(vol, t + dur * 0.6);

  // buildings along the far side, facing the car park

  for (let x = -ox - 1.2, i = 0; x < ox + 1.6; i++) {

  const water = new THREE.Mesh(geos.pondw ||= new THREE.CircleGeometry(1, 28).rotateX(-Math.PI / 2), std(th.snow ? '#cfe6f5' : '#4fa3d9', th.snow ? 0.3 : 0.08, 0.1));
  water.scale.set(1.15, 1, 0.75); water.position.set(pond.x, 0.03, pond.z); water.receiveShadow = true; world.add(water);
  const rim = new THREE.Mesh(geos.pondr ||= new THREE.RingGeometry(0.95, 1.12, 28).rotateX(-Math.PI / 2), std(th.snow ? '#e8eef3' : '#cdb98e', 0.9));
  rim.scale.set(1.15, 1, 0.75); rim.position.set(pond.x, 0.028, pond.z); world.add(rim);
  if (!th.snow) for (let i = 0; i < 7; i++) {
    const a = rnd() * Math.PI * 2, reed = new THREE.Mesh(geos.reed ||= new THREE.CylinderGeometry(0.015, 0.02, 0.45, 5), std('#4f8a3a', 0.8));
    reed.position.set(pond.x + Math.cos(a) * 1.15, 0.22, pond.z + Math.sin(a) * 0.78); reed.rotation.z = (rnd() - 0.5) * 0.3; reed.castShadow = true; decor.add(reed);
  }

    || (z > oz && Math.abs(x - cx) < ROAD_W / 2 + WALK + m) || (z < -oz - WALK && z > rowZ - 1.2 && Math.abs(x) < ox + 2)
    || Math.hypot((x - pond.x) / 1.4, (z - pond.z) / 1.0) < 1 + m || Math.hypot(x - hut.position.x, z - hut.position.z) < 0.8 + m

    if (busy(x, z, 1.25)) continue;
    bush(decor, x, z, 0.9 + rnd() * 0.5, th, rnd); i++;
  }
  if (th.flowers || th.fallen) for (let i = 0, tries = 0; i < 70 && tries < 700; tries++) {
    const x = (rnd() - 0.5) * (w + 12), z = (rnd() - 0.5) * (h + 12);

    const col = th.fallen ? th.leaves[Math.floor(rnd() * th.leaves.length)] : ['#ffffff', '#ffe066', '#ff8fbf', '#b98cff'][Math.floor(rnd() * 4)];
    const f = new THREE.Mesh(geos.petal ||= new THREE.CircleGeometry(0.07, 6).rotateX(-Math.PI / 2), std(col, 0.8)); f.position.set(x, 0.012, z); decor.add(f); i++;
  }
  if (th.snow) for (const [x, z] of [[-ox - 0.6, -oz - 0.6], [ox + 0.7, -oz - 0.5], [-ox - 0.7, oz + 0.6]]) {

/* ======== camera: fit the car park to the screen ======== */
let view = { w: 1, h: 1 }, camGoal = new THREE.Vector3(), camTarget = new THREE.Vector3(), intro = 1;
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  view = { w, h };
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (!board) return;
  const out = R + ROAD_W / 2;
  const x0 = -W2() - out - 0.1, x1 = W2() + R + 1.5, z0 = -H2() - out - 0.1, z1 = zebraZ() + 0.6;
  const target = new THREE.Vector3((x0 + x1) / 2, 0, (z0 + z1) / 2);
  // the car park's long side goes along the screen's long side: from the south on a tall screen, from the west on a wide one
  const tall = h >= w, el = THREE.MathUtils.degToRad(tall ? 60 : 56);
  const dir = (board.h >= board.w) === tall ? new THREE.Vector3(0, Math.sin(el), Math.cos(el)) : new THREE.Vector3(-Math.cos(el), Math.sin(el), 0);
  const pts = [];
  for (const x of [x0, x1]) for (const z of [z0, z1]) for (const y of [0, 1]) pts.push(new THREE.Vector3(x, y, z));
  const top = (70 + 10) / h * 2, side = 14 / w * 2, bottom = 16 / h * 2;
  let lo = 2, hi = 300;
  for (let i = 0; i < 32; i++) {
    const d = (lo + hi) / 2;
    camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    const fits = pts.every((p) => { const v = p.clone().project(camera); return Math.abs(v.x) <= 1 - side && v.y <= 1 - top && v.y >= -1 + bottom; });
    if (fits) hi = d; else lo = d;
  }
  camGoal.copy(target).addScaledVector(dir, hi); camTarget.copy(target);
  scene.fog = new THREE.Fog(theme.fog, hi * 1.5, hi * 4);
  placeCamera();
}
// at the start of a car park the camera swings in from higher up and round to the side
function placeCamera() {
  const k = ease(clamp(intro, 0, 1));
  const off = camGoal.clone().sub(camTarget);
  off.applyAxisAngle(new THREE.Vector3(0, 1, 0), (1 - k) * 0.6).multiplyScalar(1 + (1 - k) * 0.35);
  camera.position.copy(camTarget).add(off);
  camera.lookAt(camTarget); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
}
addEventListener('resize', fit);
new ResizeObserver(fit).observe(stage);

/* ======== HUD ======== */
const toScreen = (v) => { const p = v.clone().project(camera); return { x: (p.x + 1) / 2 * view.w, y: (1 - p.y) / 2 * view.h, on: p.z < 1 }; };

  $('#lvl').textContent = level;

}

const hand = $('#hand');

/* ======== little effects: puffs, dust, stars and Zzz ======== */
const fx = [];
function spawn(map, pos, vel, life, size, color, grow = 1, alpha = 1) {
  if (fx.length > 160) return;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map, color, transparent: true, depthWrite: false }));
  s.position.copy(pos); s.scale.setScalar(size); scene.add(s);
  fx.push({ s, vel, life, max: life, size, grow, alpha });
}
function stepFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    f.life -= dt;
    if (f.life <= 0) { scene.remove(f.s); f.s.material.dispose(); fx.splice(i, 1); continue; }
    f.s.position.addScaledVector(f.vel, dt);
    const k = 1 - f.life / f.max;
    f.s.scale.setScalar(f.size * (1 + k * f.grow));
    f.s.material.opacity = Math.min(1, (f.life / f.max) * 2.2) * f.alpha;
  }
}
const facing = (c) => new THREE.Vector3(Math.cos(c.yaw), 0, -Math.sin(c.yaw));
function exhaust(c, n) {
  const back = facing(c).multiplyScalar(-(c.half + 0.12));
  for (let i = 0; i < n; i++) spawn(SOFT, c.pos.clone().add(back).setY(0.22), back.clone().setLength(0.3 + Math.random() * 0.3).add(new THREE.Vector3((Math.random() - 0.5) * 0.3, 0.45, (Math.random() - 0.5) * 0.3)),

    0.5 + Math.random() * 0.3, 0.2, theme.snow ? '#ffffff' : '#cbbfa8', 1.6, 0.8);
}

/* ======== playing: taps and swipes ======== */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
function aim(e) {
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
}
function carAt(e) {

  return hits.length ? { car: hits[0].object.userData.car, point: hits[0].point } : null;
}
function duckAt(e) {
  if (!ducks) return null;

}
canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  if (!playing) return;
  down = { x: e.clientX, y: e.clientY, hit: carAt(e) };
});
canvas.addEventListener('pointerup', (e) => {
  if (!playing || !down) return;
  const d = down; down = null;
  const dx = e.clientX - d.x, dy = e.clientY - d.y, moved = Math.hypot(dx, dy);
  const hit = moved < 14 ? carAt(e) || d.hit : d.hit;
  if (!hit || hit.car.state !== 'parked') {
    // a tap on a duck: quack!
    const dk = moved < 14 && duckAt(e);

    return;
  }

  if (moved >= 30) {
    // a swipe along the car picks the way it goes
    const a = toScreen(c.home), b = toScreen(c.home.clone().add(c.ax));
    const ax = b.x - a.x, ay = b.y - a.y, dot = (ax * dx + ay * dy) / (Math.hypot(ax, ay) * moved);
    if (Math.abs(dot) < 0.45) return;

canvas.addEventListener('pointercancel', () => { down = null; });

function tapCar(c, sign, forced) {

}
function wake(c) {

// The way out: straight out of its space to a turning point far enough out that the car can turn on the spot without
// sweeping over the car park (long ones turn on the pavement's edge), then back to the middle of the road, round to

  else if (c.axis === 'h') pts = [[p.x, p.z], [-W2() - out, p.z], [-cx, Math.min(p.z + merge, cz)], [-cx, cz]];
  else if (sign < 0) pts = [[p.x, p.z], [p.x, -H2() - out], [Math.min(p.x + merge, cx), -cz], [cx, -cz]];

function placeAt(c, s) {
  const r = c.route;
  if (s <= r.pivotS + 1e-6) { const p = along(r, s); return { x: p.x, z: p.z, yaw: c.yaw0 }; }
  const k = c.half * 0.7, f = pathPoint(r, s + k), b = pathPoint(r, s - k);
  return { x: (f[0] + b[0]) / 2, z: (f[1] + b[1]) / 2, yaw: yawOf(f[0] - b[0], f[1] - b[1]) };
}
const yawFor = (c, s) => placeAt(c, s).yaw;

// a car keeps the bollards on its way down until it's out of the car park (or back in its space)
const reserve = (c, cells) => { c.cells = cells; for (const k of cells) board.reserved.set(k, (board.reserved.get(k) || 0) + 1); };
const release = (c) => { for (const k of c.cells || []) board.reserved.set(k, board.reserved.get(k) - 1); c.cells = null; };

function leave(c, sign) {
  for (const [x, y] of cellsOf(c)) board.grid[y * board.w + x] = 0;
  reserve(c, laneCells(board, c, sign));
  c.state = 'leave'; c.route = exitPath(c, sign); c.s = 0; c.v = 0; c.order = ++order; c.beepIn = 0; c.puffIn = 0;
  c.yaw0 = c.yaw; c.pivotDone = false; c.still = 0;
  const { pivot, rho } = c.route;
  zones.push({ kind: 'turn', car: c, rect: box2(pivot[0], pivot[1], 0, rho + 0.02, rho + 0.02), owner: null, entered: false });
  c.face.lids.scale.y = 1;
  c.beam.visible = !!theme.night;
  sfx.vroom(c.big);
  if (c.kind === 'police' || c.kind === 'fire' || c.kind === 'ambulance') sfx.siren(c.kind);
  if (c.kind === 'icecream') sfx.jingle();
  exhaust(c, 4);
  buzz(15);
}

function bump(c, sign, l) {
  bumps++;
  // roll on until the outlines are just short of touching: cars sit a little inside their squares, obstacles are
  // narrower than a square, a pop-up bollard is a thin post in the middle of one, and a hedge pokes in a little
  const [x, y] = c.axis === 'h' ? [l.at, c.y] : [c.x, l.at];
  const other = typeof l.hit === 'number' && l.hit > 0 && cars.find((k) => k.id === l.hit);
  const gap = other ? endGap(other) : l.hit === 'pop' ? 0.37 : l.hit === 'fence' ? -0.03
    : { cone: 0.27, tree: 0.12, bollard: 0.38 }[props.find((q) => q.x === x && q.y === y)?.kind] ?? 0.12;
  const touch = endGap(c) + gap - 0.015;
  c.state = 'bump'; c.bump = { sign, to: l.dist + touch, v: 0, t: 0, back: false, hit: l.hit, at: l.at, pop: l.pop };
  reserve(c, laneCells(board, c, sign).slice(0, Math.ceil(l.dist)));
  if (sign !== c.front) sfx.beep();
}
function impact(c) {
  const { hit, sign, at, pop } = c.bump;
  sfx.thud(); buzz(40);
  c.shake = 1;
  dust(c.pos.clone().addScaledVector(c.ax, sign * (c.len / 2 - 0.05)), 5);
  if (typeof hit === 'number' && hit > 0) {
    const o = cars.find((k) => k.id === hit);
    if (o) {
      o.shake = 1;
      if (o.sleepy) { wake(o); return; }   // bumping a sleepy car wakes it up
      o.cross = 1.6; sfx.honk(o.big, true); bubble(o, '💢');
    }
  } else if (hit === -1) {
    const [x, y] = c.axis === 'h' ? [at, c.y] : [c.x, at];
    const p = props.find((q) => q.x === x && q.y === y);
    if (p) p.wob = 1;
    sfx.boing();
  } else if (hit === 'pop') {
    if (pop) pop.wob = 1;
    sfx.clang();
    setTimeout(() => help('say-bollard'), 500);
  } else {
    const key = c.axis === 'h' ? (sign > 0 ? 'r' : 'l') + c.y : (sign > 0 ? 'b' : 't') + c.x;
    if (hedges[key]) hedges[key].userData.wob = 1;
    sfx.boing();
  }
}

/* ======== space: no car ever drives into another ======== */
// Every car has an outline, a rectangle a hair bigger than its body. A car only ever moves to where its outline
// overlaps no other car's, so cars can't drive through each other. That alone could leave two cars each waiting for
// the other, so a few places are booked first: a car pulling out books a square of road big enough to turn round in
// (before it leaves its space, so it never waits halfway out), the corner where the two streams of traffic meet takes
// one car at a time, and the ducks book their crossing. A booking is only given when nobody is in it.
const LONG_PAD = 0.06, WIDE = 0.44;
const box2 = (x, z, yaw, hl, hw) => ({ x, z, ux: Math.cos(yaw), uz: -Math.sin(yaw), hl, hw });
const outlineAt = (c, x, z, yaw) => box2(x, z, yaw, c.half + LONG_PAD, WIDE);
const endGap = (c) => (c.len - 2 * (c.half + LONG_PAD)) / 2;   // between a parked car's outline and the end of its squares
function overlaps(a, b) {   // two turned rectangles (separating axis test)
  const dx = b.x - a.x, dz = b.z - a.z;
  for (const [ax, az] of [[a.ux, a.uz], [-a.uz, a.ux], [b.ux, b.uz], [-b.uz, b.ux]]) {
    const ra = a.hl * Math.abs(a.ux * ax + a.uz * az) + a.hw * Math.abs(-a.uz * ax + a.ux * az);
    const rb = b.hl * Math.abs(b.ux * ax + b.uz * az) + b.hw * Math.abs(-b.uz * ax + b.ux * az);
    if (Math.abs(dx * ax + dz * az) >= ra + rb) return false;
  }

}
let zones = [], outlines = new Map();
// can zone z be booked by who (a car, or 'ducks')? Only when no one else is in it or has booked a piece of it.
function canBook(who, z) {
  for (const [o, f] of outlines) if (o !== who && overlaps(z.rect, f)) return false;
  for (const y of zones) if (y !== z && y.owner && y.owner !== who && overlaps(z.rect, y.rect)) return false;
  return true;
}
// is outline f free for car c? With book, it also books what it needs to get there.
function freeFor(c, f, book) {
  for (const [o, of] of outlines) if (o !== c && overlaps(f, of)) return false;
  const need = [], holds = zones.some((z) => z.owner === c), now = outlines.get(c);
  for (const z of zones) {
    if (z.owner === c || !overlaps(f, z.rect)) continue;
    if (z.owner) return false;                                   // someone else's booking
    if (z.kind === 'junction' || z.car === c) need.push(z);      // (another car's unbooked turning square is just road,
    // unless that car has been waiting to pull out: then no new car from the road drives in, so it empties and can
    // be booked; a car already in it, or holding a booking of its own, still drives on, so nobody waits for ever)
    else if (z.waiting && c.pivotDone && !holds && !(now && overlaps(now, z.rect))) return false;   // (road traffic only)
  }
  for (const z of need) if (!canBook(c, z)) return false;
  if (book) for (const z of need) { z.owner = c; z.entered = false; }
  return true;
}
// move car c up to ds along its route, as far as it can go without touching anything; returns how far it went
function advance(c, ds) {
  const at = (s) => { const p = placeAt(c, s); return outlineAt(c, p.x, p.z, p.yaw); };
  let go = ds;
  if (!freeFor(c, at(c.s + go), false)) {
    let lo = 0, hi = go;
    for (let i = 0; i < 6; i++) { const m = (lo + hi) / 2; if (freeFor(c, at(c.s + m), false)) lo = m; else hi = m; }
    go = lo;
  }
  if (go <= 1e-5) return 0;
  const f = at(c.s + go);
  if (!freeFor(c, f, true)) return 0;
  c.s += go;
  const p = placeAt(c, c.s); c.pos.set(p.x, 0, p.z); c.yaw = p.yaw; outlines.set(c, f);
  return go;
}
// bookings end once the car that holds one has driven out of it; a car that's gone gives everything back
function settleZones(c) {
  const f = outlines.get(c);
  for (const z of zones) {
    if (z.owner !== c) continue;
    if (c.state === 'gone') { z.owner = null; continue; }
    if (overlaps(f, z.rect)) z.entered = true;
    else if (z.entered) { z.owner = null; z.entered = false; if (z.car === c) z.done = true; }
  }

  else zones = zones.filter((z) => !z.done);
}
// the last resort, for a jam the rules didn't foresee: when no car has moved for STUCK_POOF seconds, the one that has
// waited longest vanishes in a puff of smoke (cars never drive through each other, even then)
function poof(c) {
  for (let i = 0; i < 10; i++) spawn(SOFT, c.pos.clone().setY(0.4), new THREE.Vector3((Math.random() - 0.5) * 1.6, 0.6 + Math.random() * 0.6, (Math.random() - 0.5) * 1.6), 0.8, 0.5, '#e9edf2', 1.5, 0.9);

  c.outOfLot = true; c.passed = true; c.state = 'gone'; c.root.visible = false;
  settleZones(c); updateHud(); checkWin();
}

// Ducks: now and then the family walks from the pond, over the zebra crossing past the barrier, to a spot on the
// grass, and later back. At the kerb they book the crossing (only when no car is on it or coming fast) and wait if
// they can't; once they've booked it, every car waits for them until the last duckling is across.
function stepDucks(dt, t) {
  if (!ducks) return;
  const D = ducks, cx = W2() + R, zz = zebraZ();
  if (!D.walking) {
    D.nextIn -= dt;
    if (D.nextIn <= 0 && playing && !won) { D.walking = true; D.t = 0; D.route = D.side === 'pond' ? D.toGrass : D.toPond; sfx.quack(); }
  }

    if (!D.zone.owner && lead >= D.route.in && last < D.route.out) {
      const busy = cars.some((c) => c.state === 'leave' && Math.abs(c.pos.x - cx) < 1.2 && c.pos.z < zz + 1 && c.pos.z > zz - 1.4 - (c.v || 0) * 0.45);
      if (!busy && canBook('ducks', D.zone)) {
        D.zone.owner = 'ducks';

      }
      else D.t = D.route.in / DUCK_SPEED;   // wait at the kerb

    if (D.zone.owner === 'ducks' && last > D.route.out) D.zone.owner = null;

      d.pos.set(p.x - p.dz * (d.i % 2 ? 0.07 : -0.07), 0, p.z + p.dx * (d.i % 2 ? 0.07 : -0.07));
      d.yaw = yawOf(p.dx, p.dz);
      if (s >= D.route.total) home++;
      const waiting = !D.zone.owner && D.t * DUCK_SPEED <= D.route.in + 1e-6 && D.t > 0;
      d.mesh.rotation.z = Math.sin(t * 14 + d.i) * 0.14 * (s > 0 && s < D.route.total && !waiting ? 1 : 0);
    } else {
      d.mesh.rotation.z = 0;
      d.pos.y = D.side === 'pond' ? 0.02 + Math.sin(t * 2 + d.i) * 0.015 : 0;
    }
    if (d.hop > 0) d.hop = Math.max(0, d.hop - dt * 3);
    d.mesh.position.set(d.pos.x, d.pos.y + Math.sin(d.hop * Math.PI) * 0.18, d.pos.z);
    d.mesh.rotation.y = d.yaw;
  }

    D.walking = false; D.zone.owner = null; D.side = D.side === 'pond' ? 'grass' : 'pond';
    D.nextIn = DUCK_EVERY[0] + Math.random() * (DUCK_EVERY[1] - DUCK_EVERY[0]);
    const [rx, rz] = D.side === 'pond' ? [D.pond.x, D.pond.z] : D.rest;
    D.list.forEach((d, i) => d.pos.set(rx + (i - 1.5) * 0.35, D.side === 'pond' ? 0.02 : 0, rz + (i % 2 ? 0.2 : -0.15)));
  }
}

function stepPops(dt, t) {
  for (const p of pops) {
    p.t -= dt;
    if (p.state === 'down' && p.t <= 0) { p.state = 'warn'; p.t = POP_WARN; }
    else if (p.state === 'warn' && p.t <= 0 && !(board.reserved.get(p.k) > 0)) { p.state = 'up'; p.up = true; p.t = POP_UP; sfx.clunk(); }
    else if (p.state === 'up' && p.t <= 0) { p.state = 'down'; p.up = false; p.t = POP_DOWN; sfx.clunk(); }
    p.h += clamp((p.up ? 1 : 0) - p.h, -dt * 5, dt * 5);
    p.post.position.y = (p.h - 1) * 0.74;
    p.light.material.emissiveIntensity = p.state === 'warn' ? (Math.floor(t * 8) % 2 ? 2.5 : 0.2) : p.up ? 1.5 : 0;
    if (p.wob > 0) { p.wob = Math.max(0, p.wob - dt * 2); p.post.rotation.z = Math.sin(t * 30) * 0.12 * p.wob; }
  }
}

function step(dt, t) {
  if (intro < 1) { intro = Math.min(1, intro + dt / 1.3); placeCamera(); }
  outlines = new Map(cars.filter((c) => c.state !== 'gone').map((c) => [c, outlineAt(c, c.pos.x, c.pos.z, c.yaw)]));
  // the cars nearest the exit move first, so a queue moves up together
  const queue = cars.filter((c) => c.state === 'leave').sort((a, b) => (a.route.total - a.s) - (b.route.total - b.s))
    .concat(cars.filter((c) => c.state !== 'leave'));
  for (const c of queue) {
    let acc = 0, turn = 0;
    if (c.state === 'leave') {
      const r = c.route, rev = c.s < r.revUntil, s0 = c.s, y0 = c.yaw, v0 = c.v;
      // waiting at the edge of the car park for its turning square: ask road traffic to leave it clear
      const square = zones.find((z) => z.car === c);
      if (square && !square.owner && c.s < r.pivotS) {
        const p = placeAt(c, Math.min(c.s + 0.05, r.pivotS));   // (only when the square is all that holds it up, not a car ahead in its lane)
        square.waiting = c.still > 1 && overlaps(outlineAt(c, p.x, p.z, p.yaw), square.rect);
      }
      if (c.s >= r.pivotS - 1e-6 && !c.pivotDone) {
        // at the turning point: stop and turn on the spot to face along the road
        c.v = 0;
        const err = wrapAngle(yawOf(r.after[0], r.after[1]) - c.yaw);
        if (Math.abs(err) <= 1e-3) c.pivotDone = true;
        else {
          const y2 = c.yaw + clamp(err, -dt * PIVOT_RATE, dt * PIVOT_RATE), f = outlineAt(c, c.pos.x, c.pos.z, y2);
          if (freeFor(c, f, true)) { c.yaw = y2; outlines.set(c, f); }

        let top = c.s < r.pivotS ? DRIVE_SPEED : ROAD_SPEED;
        if (rev) top *= 0.7;
        if (c.s < r.pivotS) top = Math.min(top, Math.sqrt(BRAKE * (r.pivotS - c.s)) + 0.4);   // slow down for the turning point
        else if (Math.abs(wrapAngle(yawFor(c, c.s + 1.0) - c.yaw)) > 0.3) top = Math.min(top, 2.6);   // and for bends
        // look as far ahead as it takes to stop: brake if that spot is taken
        const look = Math.min(c.s + c.v * c.v / (2 * BRAKE) + 0.15, c.s < r.pivotS ? r.pivotS : r.total + 2), p = placeAt(c, look);
        const clear = freeFor(c, outlineAt(c, p.x, p.z, p.yaw), false);

        let ds = c.v * dt;

      if (c.v > 0.2 && c.v < 3.5 && (c.puffIn -= dt) <= 0) { exhaust(c, 1); c.puffIn = 0.16; }
      if (c.cells && c.s >= r.lotEnd) release(c);
      if (!c.outOfLot && c.s >= r.lotEnd) { c.outOfLot = true; sfx.pop(); updateHud(); const el = $('#left'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); checkWin(); }
      for (const [i, f] of c.flash.entries()) f.visible = Math.floor(t * 6 + i) % 2 === 0;
      if (!c.passed && c.pos.z > gate.z + 2.5) { c.passed = true; stars(c.pos); sfx.sparkle(); checkWin(); }
      if (c.s >= r.total) { c.state = 'gone'; c.root.visible = false; outlines.delete(c); }
      settleZones(c);
    } else if (c.state === 'bump') {
      const b = c.bump;
      const at = (off) => outlineAt(c, c.home.x + c.ax.x * b.sign * off, c.home.z + c.ax.z * b.sign * off, c.yaw);
      if (!b.back) {
        const v0 = b.v;
        b.v = Math.min(BUMP_SPEED, b.v + dt * 14);
        acc = (b.v - v0) / Math.max(dt, 1e-3) * (b.sign === c.front ? 1 : -1);
        const off2 = Math.min(b.to, c.off + b.v * dt);

        } else { b.back = true; b.from = c.off; b.t = 0.12; }   // a moving car is crossing its way: roll back without a bump
      } else {

    c.roll = lerp(c.roll, clamp(-turn / Math.max(dt, 1e-3) * (c.v || 0) * 0.012, -0.08, 0.08), Math.min(1, dt * 8));
    if (c.shake > 0) c.shake = Math.max(0, c.shake - dt * 2.5);

    c.body.rotation.x = c.roll + Math.sin(t * 40) * 0.06 * c.shake;
    c.body.position.y = Math.abs(Math.sin(t * 30)) * 0.05 * c.shake + Math.sin(c.hop * Math.PI) * 0.35;

    if (c.cross > 0) c.cross -= dt;
    for (const br of c.face.brows) br.visible = c.cross > 0;
    if (c.sleepy) {

      c.body.scale.y = 1 + Math.sin(t * 2 + c.id) * 0.02;
      if ((c.zIn -= dt) <= 0) { c.zIn = 0.8; spawn(ZED, c.pos.clone().setY(c.big ? 1.3 : 1.0), new THREE.Vector3(0.22, 0.55, -0.12), 1.8, 0.42, '#dff1ff', 0.7); }
    } else {
      c.body.scale.y = 1;
      if ((c.blink -= dt) <= 0) { c.blink = 2 + Math.random() * 4; c.blinkT = 0.13; }
      if (c.blinkT > 0) { c.blinkT -= dt; c.face.lids.scale.y = c.blinkT > 0 ? 0.12 : 1; }
    }
  }

  for (const p of props) if (p.wob > 0) { p.wob = Math.max(0, p.wob - dt * 2); p.mesh.rotation.z = Math.sin(t * 25) * 0.25 * p.wob; }
  for (const k in hedges) { const m = hedges[k]; if (m.userData.wob > 0) { m.userData.wob = Math.max(0, m.userData.wob - dt * 2.5); m.scale.y = 1 + Math.sin(t * 30) * 0.2 * m.userData.wob; } }
  stepPops(dt, t);
  stepDucks(dt, t);
  stepFx(dt);
  if (fall) {
    const a = fall.pts.geometry.attributes.position, arr = a.array, half = fall.span / 2, snow = fall.kind === 'snow';
    for (let i = 0; i < arr.length; i += 3) {
      arr[i + 1] -= dt * (snow ? 0.7 : 0.9);
      arr[i] += Math.sin(t * (snow ? 1.3 : 2) + i) * dt * (snow ? 0.25 : 0.6);
      if (arr[i + 1] < 0) { arr[i + 1] = 8; arr[i] = (Math.random() - 0.5) * fall.span; arr[i + 2] = (Math.random() - 0.5) * fall.span; }
      if (arr[i] > half) arr[i] -= fall.span; else if (arr[i] < -half) arr[i] += fall.span;
    }
    a.needsUpdate = true;
  }
  // the barrier lifts for any car about to reach it
  const near = cars.some((c) => c.state === 'leave' && c.pos.z > gate.z - 2.6 && c.pos.z < gate.z + 1.2 && Math.abs(c.pos.x - gate.x) < 0.8);
  if (near && !gate.open) sfx.gate();
  gate.open = near;
  gate.angle += clamp((near ? 1.35 : 0) - gate.angle, -dt * 5, dt * 5);
  gate.pivot.rotation.z = gate.angle;
  const moving = cars.some((c) => c.state === 'leave' || c.state === 'bump' || c.shake > 0 || c.hop > 0 || Math.abs(c.pitch) > 1e-3 || Math.abs(c.roll) > 1e-3)
    || pops.some((p) => (p.h > 0 && p.h < 1) || p.wob > 0) || props.some((p) => p.wob > 0) || Object.values(hedges).some((m) => m.userData.wob > 0)
    || (ducks && (ducks.walking || ducks.list.some((d) => d.hop > 0))) || Math.abs(gate.angle - (near ? 1.35 : 0)) > 1e-3;
  if (moving || wasMoving || shadowDirty) renderer.shadowMap.needsUpdate = true;   // (one more after it stops, for the last position)
  wasMoving = moving; shadowDirty = false;
  // a hand points at a car that can go when nothing has happened for a while
  if (playing && !won) {
    if (!cars.some((c) => c.state === 'leave' && !c.outOfLot)) hintIn -= dt;
    if (hintIn <= 0 && !hintCar) showHint();
    if (hintCar && hintCar.state !== 'parked') hideHint();
  }
  if (hintCar) { const p = toScreen(hintCar.pos.clone().setY(0.5)); hand.style.transform = `translate(${p.x - 27}px, ${p.y - 4}px)`; }
  for (const el of document.querySelectorAll('.bubble')) el._place?.();
}

// The cheer comes the moment the last car is out of the car park (not seconds later, when it reaches the barrier);
// the ▶ card comes once that car has driven past the barrier.
let cardDue = false;
function checkWin() {
  if (!won && cars.every((c) => c.outOfLot)) {
    won = true; hideHint();
    const secs = Math.round((performance.now() - startedAt) / 1000);
    window.tbxEvent?.('level-end', { level, won: true, taps, bumps, secs });
    store.set('level', level + 1);
    sfx.fanfare();
    setTimeout(() => sfx.say(['say-out-1', 'say-out-2', 'say-out-3'][level % 3]), 900);
    confetti();
  }
  if (won && !cardDue && cars.every((c) => c.passed)) {
    cardDue = true;
    const n = level;
    setTimeout(() => { if (level !== n) return; $('#dlvl').textContent = level; $('#done').hidden = false; playing = false; }, 500);
  }
}
function confetti() {
  if (REDUCED) return;
  for (let i = 0; i < 46; i++) {
    const el = document.createElement('div'); el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw'; el.style.background = COLORS[i % COLORS.length];
    el.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; el.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(el); setTimeout(() => el.remove(), 4000);
  }
}

let last = performance.now(), simTime = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  simTime += dt;
  step(dt, simTime);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ======== start, next level, sound button ======== */
level = Math.max(1, parseInt(params.get('level'), 10) || store.get('level', 1));
buildLevel(level);
$('#tlvl').textContent = level;
$('#again').hidden = level <= 1;
requestAnimationFrame(frame);

// music for the look of the car park, and the sleepy-car line once a car park with one starts
function startPlay() {
  playing = true;
  sfx.music(theme.night ? 'music-night' : 'music-day');
  const n = level;
  if (cars.some((c) => c.sleepy)) setTimeout(() => { if (level === n && playing) help('say-sleepy'); }, 1500);
}
$('#play').addEventListener('click', () => { sfx.init(); sfx.tap(); $('#title').hidden = true; startPlay(); });
$('#again').addEventListener('click', () => { store.set('level', 1); buildLevel(1); $('#tlvl').textContent = 1; $('#again').hidden = true; });
$('#next').addEventListener('click', () => { sfx.init(); sfx.tap(); $('#done').hidden = true; buildLevel(level + 1); startPlay(); });
const muteBtn = $('#mute');
const drawMute = () => { muteBtn.textContent = sfx.muted ? '🔇' : '🔈'; };
drawMute();
muteBtn.addEventListener('click', () => { sfx.init(); sfx.toggle(); drawMute(); });
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// for testing from the console: carpark.solve() taps the cars that can go, one a second
window.carpark = {
  get board() { return board; }, get cars() { return cars; }, get level() { return level; }, get ducks() { return ducks; }, get pops() { return pops; }, get zones() { return zones; }, get audio() { return { loaded: sfx.loaded, running: sfx.running, muted: sfx.muted, music: sfx.playingMusic }; },
  // what's in the way of car id's next move (for finding jams)
  why(id) {
    const c = cars.find((k) => k.id === id); if (!c || c.state !== 'leave') return null;
    const r = c.route, pivoting = c.s >= r.pivotS - 1e-6 && !c.pivotDone;
    let f;
    if (pivoting) { const err = wrapAngle(yawOf(r.after[0], r.after[1]) - c.yaw); f = outlineAt(c, c.pos.x, c.pos.z, c.yaw + clamp(err, -0.1, 0.1)); }
    else { const p = placeAt(c, c.s + 0.05); f = outlineAt(c, p.x, p.z, p.yaw); }
    const out = { pivoting, v: c.v, freeNext: freeFor(c, f, false), cars: [], zones: [] };
    for (const [o, of] of outlines) if (o !== c && overlaps(f, of)) out.cars.push(o.id + o.state);
    for (const z of zones) if (z.owner !== c && overlaps(f, z.rect)) {
      const who = [...outlines].filter(([o, of]) => o !== c && overlaps(z.rect, of)).map(([o]) => o.id);
      const claims = zones.filter((y) => y !== z && y.owner && y.owner !== c && overlaps(z.rect, y.rect)).map((y) => y.kind + (y.car ? '#' + y.car.id : '') + '@' + (y.owner === 'ducks' ? 'ducks' : y.owner.id));
      out.zones.push(`${z.kind}${z.car ? '#' + z.car.id : ''}${z.waiting ? ' WAITING' : ''} owner=${z.owner === 'ducks' ? 'ducks' : z.owner ? z.owner.id : '-'} carsIn=[${who}] overlappingBookings=[${claims}]`);
    }
    return out;
  },
  go(n) { $('#title').hidden = true; $('#done').hidden = true; buildLevel(n); playing = true; },
  solve(ms = 900) {
    const t = setInterval(() => {
      const c = cars.find((k) => k.state === 'parked' && free(board, k));
      if (!c) { if (cars.every((k) => k.state !== 'parked')) clearInterval(t); return; }
      tapCar(c, lane(board, c, c.front).ok ? c.front : -c.front, true);
    }, ms);
  },
  depth: () => depthOf(board),
  get draws() { return renderer.info.render; },
  get three() { return { scene, hemi, sun, renderer, camera, mats }; },
  // run the game clock by hand (a hidden browser tab barely draws frames)
  tick(seconds, draw = true) { for (let i = 0; i < seconds * 30; i++) { simTime += 1 / 30; step(1 / 30, simTime); } if (draw) renderer.render(scene, camera); },
  // tap a car the way a finger would: sign +1 / -1 is the half that's tapped, along the car's axis
  screenOf(id) { const c = cars.find((k) => k.id === id); return c && toScreen(c.pos.clone().setY(0.5)); },
  tap(id, sign) { const c = cars.find((k) => k.id === id); if (c && c.state === 'parked') tapCar(c, sign ?? c.front, false); },
};
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// three.js) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
